# Name-path redirects for memorable short URLs (#360).
# This is not a reverse proxy and not TLS termination.
# Real content stays on the existing service ports.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Container liveness only. Do not follow name redirects from HEALTHCHECK.
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    # Beginner entry → Example Catalog
    location = / {
        return 302 http://$host:4200/;
    }

    location = /catalog {
        return 302 http://$host:4200/;
    }
    location = /catalog/ {
        return 302 http://$host:4200/;
    }

    location = /editor {
        return 302 http://$host:8080/;
    }
    location = /editor/ {
        return 302 http://$host:8080/;
    }

    location = /example {
        return 302 http://$host:4173/;
    }
    location = /example/ {
        return 302 http://$host:4173/;
    }

    # Browser-openable Runtime health. WebSocket stays ws://$host:33330/
    location = /runtime {
        return 302 http://$host:33330/health;
    }
    location = /runtime/ {
        return 302 http://$host:33330/health;
    }
}
