# Static host for docs/examples (bind-mounted at runtime).
# Directory URLs such as /led-blink/ serve that folder's index.html.
# Do not fall back to a SPA root index; examples are separate trees.
server {
    listen 4173;
    listen [::]:4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
