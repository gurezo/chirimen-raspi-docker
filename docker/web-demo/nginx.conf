# Static host for apps/web-demo production build.
# Hash routes (#/gpio-output etc.) do not need SPA fallback; try_files
# still serves index.html for a missing path.
server {
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
