services:
  chirimen-server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    image: ghcr.io/gurezo/chirimen-raspi-docker/server:latest
    environment:
      HOST: 0.0.0.0
      PORT: 33330
    ports:
      - "33330:33330"
    # GPIO / I2C access without privileged mode (Raspberry Pi host).
    # node-web-gpio uses /sys/class/gpio; /dev/gpiomem is exposed for host GPIO access.
    # node-web-i2c uses /dev/i2c-1 for the primary I2C bus.
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/i2c-1:/dev/i2c-1
    volumes:
      - /sys/class/gpio:/sys/class/gpio
