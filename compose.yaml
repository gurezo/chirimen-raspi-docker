services:
  chirimen-server:
    build:
      context: .
      # Default is 64-bit (Node 24). scripts/start.sh overrides this for
      # 32-bit OS (--32bit / auto-detect) to docker/server/Dockerfile.32bit.
      dockerfile: docker/server/Dockerfile
    image: chirimen-raspi-docker/server:phase1
    environment:
      HOST: 0.0.0.0
      PORT: 33330
    ports:
      - "33330:33330"
    # GPIO / I2C without privileged mode.
    # Always mount sysfs GPIO paths for node-web-gpio.
    # /sys/class/gpio alone is not enough: export creates gpioN as a symlink
    # into /sys/devices/..., and container /sys is read-only by default
    # (EROFS on direction/value). Mount both class and devices.
    # Optional host devices (/dev/gpiomem*, /dev/gpiochip*, /dev/i2c-1) are
    # added only when present by scripts/start.sh via a Compose override.
    # Do not list optional devices here: missing paths fail compose up on
    # hosts that lack them (e.g. Pi 5 without gpiomem, non-Pi).
    volumes:
      - /sys/class/gpio:/sys/class/gpio
      - /sys/devices:/sys/devices

  # Browser Editor (code-server). Independent of Runtime: no depends_on.
  # This is not a Hardware Runtime. Do not add devices, privileged, or
  # /sys/class/gpio / /sys/devices. GPIO / I2C stay on chirimen-server.
  # Default host bind is 127.0.0.1 (#181). LAN is opt-in via
  # CHIRIMEN_PUBLISH_BIND=0.0.0.0 or ./scripts/start.sh --editor --lan.
  # Do not publish to the Internet from this file. Auth is password
  # (Dockerfile --auth password). Do not set auth: none. Do not commit
  # PASSWORD. Optional CHIRIMEN_EDITOR_PASSWORD / HASHED_PASSWORD are
  # injected by start.sh when set; empty PASSWORD= is never written here.
  # Optional via Compose profile `editor` (#177).
  # `docker compose up` starts Runtime only.
  # `docker compose --profile editor up` starts Runtime + Editor + Web Demo.
  # Persistence (#176): bind docs/examples for workspace; named volumes
  # for settings / extensions. Host uid via user + DOCKER_USER (fixuid).
  # Do not run as root. docker compose down -v deletes named volumes,
  # not the workspace bind mount.
  # Do not set no-new-privileges or cap_drop ALL here: the official
  # entrypoint runs fixuid (setuid). Either flag exits the container
  # before code-server binds 8080.
  # Example static server (#179): ${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:4173.
  # Serve from /home/coder/project (docs/examples) so led-blink / button /
  # i2c-scan are reachable together. Web Demo is a separate service
  # (chirimen-web-demo, #180). Node / pnpm / Nx stay out of this image.
  chirimen-editor:
    profiles:
      - editor
    build:
      context: docker/editor
      dockerfile: Dockerfile
    image: chirimen-raspi-docker/editor:4.132.0
    user: "${CHIRIMEN_EDITOR_UID:-1000}:${CHIRIMEN_EDITOR_GID:-1000}"
    environment:
      DOCKER_USER: "${CHIRIMEN_EDITOR_USER:-coder}"
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:8080:8080"
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:4173:4173"
    volumes:
      - ./docs/examples:/home/coder/project
      - chirimen-editor-local:/home/coder/.local
      - chirimen-editor-config:/home/coder/.config

  # Browser Web Demo (nginx static of apps/web-demo). Independent of
  # Runtime and Editor: no depends_on. This is not a Hardware Runtime.
  # Do not add devices, privileged, or /sys/class/gpio / /sys/devices.
  # Browser JS connects to the Runtime WebSocket on the host; this
  # container only serves static files. Default host bind is 127.0.0.1
  # (#181). LAN is the same CHIRIMEN_PUBLISH_BIND / --lan as Editor.
  # Optional via Compose profile `editor` (#180).
  # `docker compose --profile editor up` starts Runtime + Editor + Web Demo.
  # Host `pnpm nx serve web-demo` (Vite HMR) also uses port 4200; stop this
  # service first. GPIO / I2C stay on chirimen-server.
  chirimen-web-demo:
    profiles:
      - editor
    build:
      context: .
      dockerfile: docker/web-demo/Dockerfile
    image: chirimen-raspi-docker/web-demo:phase8
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:4200:4200"
    security_opt:
      - no-new-privileges:true

volumes:
  chirimen-editor-local:
  chirimen-editor-config:
