# Normal use pulls pre-built GHCR images (tag latest). Do not add build:
# here. Dockerfiles remain the image source for GHCR publish:
#   chirimen-runtime: docker/server/Dockerfile
#     (Node 24; single Runtime path; no bitness override)
#   chirimen-editor: docker/editor/Dockerfile
#   chirimen-example-server: docker/example-server/Dockerfile
#   chirimen-example-catalog: docker/example-catalog/Dockerfile
#   chirimen-gateway: docker/nginx/Dockerfile
services:
  chirimen-runtime:
    image: ghcr.io/gurezo/chirimen-runtime:latest
    environment:
      HOST: 0.0.0.0
      PORT: 33330
    ports:
      - "33330:33330"
    # GPIO / I2C without privileged mode.
    # Always mount sysfs GPIO paths for node-web-gpio.
    # /sys/class/gpio alone is not enough: export creates gpioN as a symlink
    # into /sys/devices/..., and container /sys is read-only by default
    # (EROFS on direction/value). Mount both class and devices.
    # Optional host devices (/dev/gpiomem*, /dev/gpiochip*, /dev/i2c-1) are
    # added only when present by scripts/start.sh via a Compose override.
    # Do not list optional devices here: missing paths fail compose up on
    # hosts that lack them (e.g. Pi 5 without gpiomem, non-Pi).
    volumes:
      - /sys/class/gpio:/sys/class/gpio
      - /sys/devices:/sys/devices

  # Browser Editor (code-server). Independent of Runtime: no depends_on.
  # This is not a Hardware Runtime. Do not add devices, privileged, or
  # /sys/class/gpio / /sys/devices. GPIO / I2C stay on chirimen-runtime.
  # Default host bind is 127.0.0.1 (#181). LAN is opt-in via
  # CHIRIMEN_PUBLISH_BIND=0.0.0.0 or ./scripts/start.sh --lan.
  # Do not publish to the Internet from this file. Auth is password
  # (Dockerfile --auth password). Do not set auth: none. Do not commit
  # PASSWORD. Optional CHIRIMEN_EDITOR_PASSWORD / HASHED_PASSWORD are
  # injected by start.sh when set; empty PASSWORD= is never written here.
  # `docker compose up` / `./scripts/start.sh` start Runtime + Editor +
  # Example Server + Example Catalog + Gateway (#208 / #254 / #263 / #360).
  # Runtime only via Compose is `docker compose up chirimen-runtime`.
  # Persistence (#176 / #241): bind workspace/ for Editor workspace;
  # named volumes for settings / extensions. Host uid via user +
  # DOCKER_USER (fixuid).
  # Do not run as root. docker compose down -v deletes named volumes,
  # not the workspace bind mount.
  # Do not set no-new-privileges or cap_drop ALL here: the official
  # entrypoint runs fixuid (setuid). Either flag exits the container
  # before code-server binds 8080.
  # Example static server is chirimen-example-server (#179 / #370), not this service.
  # Example Catalog is chirimen-example-catalog (#254 / #263). Node / pnpm
  # / Nx stay out of this image.
  chirimen-editor:
    image: ghcr.io/gurezo/chirimen-editor:latest
    user: "${CHIRIMEN_EDITOR_UID:-1000}:${CHIRIMEN_EDITOR_GID:-1000}"
    environment:
      DOCKER_USER: "${CHIRIMEN_EDITOR_USER:-coder}"
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./workspace:/home/coder/project
      - chirimen-editor-local:/home/coder/.local
      - chirimen-editor-config:/home/coder/.config

  # Example Server (nginx static of workspace/). Independent of
  # Runtime, Editor, and Catalog: no depends_on. This is not a
  # Hardware Runtime. Do not add devices, privileged, or
  # /sys/class/gpio / /sys/devices. Bind the same host path the Editor
  # edits so Browser reload sees saves. Default host bind is 127.0.0.1
  # (#181). LAN is the same CHIRIMEN_PUBLISH_BIND / --lan as Editor.
  chirimen-example-server:
    image: ghcr.io/gurezo/chirimen-example-server:latest
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:4173:4173"
    volumes:
      - ./workspace:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true

  # Example Catalog (nginx static of apps/catalog). Independent of
  # Runtime, Editor, and Example Server: no depends_on. This is not a
  # Hardware Runtime. Do not add devices, privileged, or
  # /sys/class/gpio / /sys/devices. Browser JS fetches Device metadata
  # from chirimen-certified-devices and links ported Examples to :4173.
  # Default host bind is 127.0.0.1 (#181). LAN is the same
  # CHIRIMEN_PUBLISH_BIND / --lan as Editor. Host `pnpm nx serve
  # catalog` also uses port 4200; stop this service first.
  chirimen-example-catalog:
    image: ghcr.io/gurezo/chirimen-example-catalog:latest
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:4200:4200"
    security_opt:
      - no-new-privileges:true

  # Name-path redirect gateway (#360). Independent of Runtime / Editor /
  # Example Server / Catalog: no depends_on. Not a Hardware Runtime and not TLS
  # termination. GET /catalog|/editor|/example|/runtime 302 to the existing
  # ports. Default host bind is 127.0.0.1 (#181). LAN is the same
  # CHIRIMEN_PUBLISH_BIND / --lan as Editor.
  chirimen-gateway:
    image: ghcr.io/gurezo/chirimen-gateway:latest
    ports:
      - "${CHIRIMEN_PUBLISH_BIND:-127.0.0.1}:80:80"
    security_opt:
      - no-new-privileges:true

volumes:
  chirimen-editor-local:
  chirimen-editor-config:
