# Publish the five GHCR images for linux/arm64.
# publish pushes only the immutable sha-<12> tag.
# verify checks every manifest and reports images that were not published.
# retag applies main / latest / vX.Y.Z only after verify succeeds.
# Tag policy: docs/architecture/ghcr.md (#375).

name: Docker publish

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: latest タグをこの digest に更新する
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chirimen-runtime
            context: .
            file: docker/server/Dockerfile
          - name: chirimen-editor
            context: docker/editor
            file: docker/editor/Dockerfile
          - name: chirimen-example-server
            context: docker/example-server
            file: docker/example-server/Dockerfile
          - name: chirimen-example-catalog
            context: .
            file: docker/example-catalog/Dockerfile
          - name: chirimen-gateway
            context: docker/nginx
            file: docker/nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve sha tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.sha }}

  verify:
    name: Verify manifests
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect image manifests
        env:
          OWNER: ${{ github.repository_owner }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          sha_tag="sha-$(git rev-parse --short=12 HEAD)"
          images=(
            chirimen-runtime
            chirimen-editor
            chirimen-example-server
            chirimen-example-catalog
            chirimen-gateway
          )
          missing=0

          for name in "${images[@]}"; do
            ref="ghcr.io/${OWNER}/${name}:${sha_tag}"
            echo "::group::${ref}"
            if ! inspect="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              printf '%s\n' "$inspect"
              echo "::error title=${name}::${name} was not published at ${sha_tag}"
              missing=1
              echo "::endgroup::"
              continue
            fi
            printf '%s\n' "$inspect"
            # Text inspect prints Platform: only for an index. A one-platform
            # push is an image manifest, and its platform is on the image config.
            # .Image is that config, or a platform→config map for an index.
            if ! image_json="$(docker buildx imagetools inspect --format '{{json .Image}}' "$ref" 2>&1)"; then
              printf '%s\n' "$image_json"
              echo "::error title=${name}::${name} image config could not be read"
              missing=1
              echo "::endgroup::"
              continue
            fi
            if ! platforms="$(printf '%s\n' "$image_json" | jq -r '
              if (.os | type) == "string" and (.architecture | type) == "string" then
                if (.variant | type) == "string" and .variant != "" then
                  "\(.os)/\(.architecture)/\(.variant)"
                else
                  "\(.os)/\(.architecture)"
                end
              elif type == "object" then
                keys[]
              else
                empty
              end
            ')"; then
              echo "::error title=${name}::${name} image config could not be parsed"
              missing=1
              echo "::endgroup::"
              continue
            fi
            if [[ -z "$platforms" ]]; then
              echo "::error title=${name}::${name} manifest did not report a platform"
              missing=1
              echo "::endgroup::"
              continue
            fi
            while IFS= read -r platform; do
              case "$platform" in
                linux/arm64|linux/arm64/v8) ;;
                *)
                  echo "::error title=${name}::${name} has platform ${platform}"
                  missing=1
                  ;;
              esac
            done <<< "$platforms"
            echo "::endgroup::"
          done

          if [[ "$PUBLISH_RESULT" != "success" ]]; then
            echo "::error::one or more image publishes failed (${PUBLISH_RESULT})"
            missing=1
          fi

          exit "$missing"

  retag:
    name: Apply release tags
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply moving tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha_tag="sha-$(git rev-parse --short=12 HEAD)"
          images=(
            chirimen-runtime
            chirimen-editor
            chirimen-example-server
            chirimen-example-catalog
            chirimen-gateway
          )
          tags=()

          add_tag() {
            local candidate="$1"
            local existing
            if [[ ${#tags[@]} -gt 0 ]]; then
              for existing in "${tags[@]}"; do
                if [[ "$existing" == "$candidate" ]]; then
                  return
                fi
              done
            fi
            tags+=("$candidate")
          }

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::git tag ${REF_NAME} is not vX.Y.Z"
              exit 1
            fi
            add_tag "${REF_NAME#v}"
            add_tag "$REF_NAME"
            add_tag latest
          fi

          if [[ "$REF" == "refs/heads/main" ]]; then
            git fetch origin main
            tip="$(git rev-parse origin/main)"
            if [[ "$tip" == "$GITHUB_SHA" ]]; then
              add_tag main
            else
              echo "Skip main tag: origin/main is ${tip}, this run is ${GITHUB_SHA}"
            fi
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_LATEST" == "true" ]]; then
            add_tag latest
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "No moving tags to apply"
            exit 0
          fi

          echo "Apply tags: ${tags[*]}"
          for name in "${images[@]}"; do
            source="ghcr.io/${OWNER}/${name}:${sha_tag}"
            args=()
            for tag in "${tags[@]}"; do
              args+=(-t "ghcr.io/${OWNER}/${name}:${tag}")
            done
            docker buildx imagetools create "${args[@]}" "$source"
          done
