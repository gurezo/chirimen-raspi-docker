# Publish the five GHCR images for linux/arm64.
# This job pushes only the immutable sha-<12> tag.
# main / latest / vX.Y.Z are applied in a later job, after every image exists.
# Tag policy: docs/architecture/ghcr.md (#375).

name: Docker publish

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: latest タグをこの digest に更新する
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chirimen-runtime
            context: .
            file: docker/server/Dockerfile
          - name: chirimen-editor
            context: docker/editor
            file: docker/editor/Dockerfile
          - name: chirimen-example-server
            context: docker/example-server
            file: docker/example-server/Dockerfile
          - name: chirimen-example-catalog
            context: .
            file: docker/example-catalog/Dockerfile
          - name: chirimen-gateway
            context: docker/nginx
            file: docker/nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve sha tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.sha }}
