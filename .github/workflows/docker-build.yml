# Build the five publishable images for linux/arm64.
# This workflow does not log in to GHCR and does not push.
# Publish is #375.

name: Docker build

on:
  pull_request:
    branches:
      - main
    paths:
      - "docker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "nx.json"
      - "tsconfig*.json"
      - "apps/**"
      - "libs/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chirimen-runtime
            context: .
            file: docker/server/Dockerfile
            artifact: runtime
          - name: chirimen-editor
            context: docker/editor
            file: docker/editor/Dockerfile
            artifact: none
          - name: chirimen-example-server
            context: docker/example-server
            file: docker/example-server/Dockerfile
            artifact: none
          - name: chirimen-example-catalog
            context: .
            file: docker/example-catalog/Dockerfile
            artifact: catalog
          - name: chirimen-gateway
            context: docker/nginx
            file: docker/nginx/Dockerfile
            artifact: none
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: ${{ matrix.name }}:ci

      - name: Check architecture and source label
        run: |
          image="${{ matrix.name }}:ci"
          arch="$(docker image inspect --format '{{.Architecture}}' "$image")"
          source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")"
          test "$arch" = "arm64"
          test "$source" = "https://github.com/gurezo/chirimen-raspi-docker"

      - name: Check runtime artifacts
        if: matrix.artifact == 'runtime'
        run: |
          docker run --rm --entrypoint node chirimen-runtime:ci -e "require('node:fs').accessSync('apps/runtime/dist/main.js')"
          docker run --rm --entrypoint node chirimen-runtime:ci -e "const fs=require('node:fs'); const path=require('node:path'); const {createRequire}=require('node:module'); const req=createRequire(require.resolve('node-web-i2c')); const pkg=req.resolve('i2c-bus/package.json'); fs.accessSync(path.join(path.dirname(pkg),'build/Release/i2c.node'));"

      - name: Check catalog artifact
        if: matrix.artifact == 'catalog'
        run: |
          docker run --rm --entrypoint ls chirimen-example-catalog:ci /usr/share/nginx/html/index.html
